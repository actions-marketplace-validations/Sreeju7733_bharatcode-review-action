name: BharatCode Self-Review (Dogfood)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    name: Review PR Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1

      - name: Check API Key Configuration
        id: check-key
        env:
          KEY: ${{ secrets.BHARATCODE_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=BharatCode Key Missing::BHARATCODE_API_KEY secret is not configured in repository secrets. Live PR review skipped."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run BharatCode Review Action
        if: steps.check-key.outputs.has_key == 'true'
        uses: ./
        with:
          bharatcode-api-key: ${{ secrets.BHARATCODE_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: "summary+inline"
          severity-threshold: "warning"
          fail-on-severity: "error"
          cache-enabled: "true"
